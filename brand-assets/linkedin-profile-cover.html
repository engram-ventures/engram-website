<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engram Ventures — LinkedIn Profile Cover</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #1C2B3A; }

  /* Native LinkedIn personal profile cover: 1584 x 396 (4:1). */
  .banner {
    position: relative;
    width: 1584px;
    height: 396px;
    overflow: hidden;
    background: radial-gradient(120% 150% at 50% 44%, #25394e 0%, #1C2B3A 54%, #16222e 100%);
    font-family: 'Jost', sans-serif;
  }

  /* Symmetric blueprint grid, fading from centre — "structure that holds" */
  .grid-motif {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(245,241,235,0.04) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(245,241,235,0.04) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(110% 130% at 50% 50%, #000 28%, transparent 80%);
    -webkit-mask-image: radial-gradient(110% 130% at 50% 50%, #000 28%, transparent 80%);
  }

  /* Faint ghost monogram on the FAR RIGHT — clear of the bottom-left avatar */
  .ghost-mark {
    position: absolute;
    top: 50%;
    right: 96px;
    transform: translateY(-50%);
  }

  /*
    Centred content. The profile avatar overlaps the bottom-LEFT corner, so the
    block is nudged up a touch; centring keeps it clear of the avatar on desktop
    and safe under LinkedIn's mobile crop.
  */
  .content {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 16px;
    transform: translateY(-14px);
  }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .rule {
    width: 38px;
    height: 3px;
    background: #C96A3A;
    border-radius: 1px;
  }
  .eyebrow-label {
    color: #F5F1EB;
    font-family: 'Jost', sans-serif;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    padding-left: 0.3em;
  }

  .headline {
    color: #F5F1EB;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 70px;
    line-height: 1.0;
    letter-spacing: -0.01em;
  }

  .subline {
    color: #9EABB8;
    font-family: 'Jost', sans-serif;
    font-weight: 400;
    font-size: 20px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="banner">
    <div class="grid-motif"></div>

    <!-- Ghost monogram E (same geometry as engram-monogram.svg) -->
    <svg class="ghost-mark" width="300" height="300" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(20, 20)">
        <rect x="0" y="0" width="6" height="80" fill="#F5F1EB" rx="1" opacity="0.06"/>
        <rect x="0" y="0" width="60" height="6" fill="#F5F1EB" rx="1" opacity="0.06"/>
        <rect x="13" y="37" width="47" height="6" fill="#C96A3A" rx="1" opacity="0.16"/>
        <rect x="20" y="74" width="40" height="6" fill="#F5F1EB" rx="1" opacity="0.06"/>
      </g>
    </svg>

    <div class="content">
      <div class="eyebrow">
        <div class="rule"></div>
        <div class="eyebrow-label">Engram Ventures</div>
        <div class="rule"></div>
      </div>
      <div class="headline">Engineering that holds.</div>
      <div class="subline">AI capability that survives production.</div>
    </div>
  </div>
</body>
</html>
